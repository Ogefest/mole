# What a pushed tag does.
#
# Until this file existed, nothing: a tag went to GitHub and was looked at by
# nobody. `scripts/release.sh` is the only thing that makes one, and it has
# already run all three test tiers -- including the two that need the live
# environment, which this runner cannot reach and never will. So the division is
# deliberate: the local gate runs everything, and this runs the tier a runner can.
# See MOLE-118, MOLE-119 and MOLE-120.
#
# Testing again here is the point rather than a formality. It is a different
# machine with different libraries, and a suite that is green on the author's
# machine and red on a clean Ubuntu is exactly the fact worth learning before the
# artefacts are published rather than after.
#
# **A dispatch run is a rehearsal and publishes nothing.** Fourteen steps had never
# executed and the only trigger was a real tag, so the first run of any of them
# would have been a release -- and a failure at step eight leaves a published tag,
# no release, and a version number that is either burned or has to be un-published.
# A dispatch runs the thirteen steps that can fail, unchanged, and stops at the
# last one: `Publish` is guarded to a push, and the artefacts go to the run instead
# so a rehearsal can be looked at rather than only passed. MOLE-307's rule and
# MOLE-314 applying it here: a YAML file that has never run is a hypothesis.
#
# **And it has published one: run 33472868494, from a pushed tag on 2026-09-01** --
# the first release this repository has ever had. Eighteen steps, `Publish` among
# them and the rehearsal upload correctly skipped, which is the arrangement below
# doing both halves of what it says. The version is deliberately not written here:
# this file asks the build what it is, and `tst_ReleaseWorkflow.sh` holds it to that
# in prose as well as in code. See MOLE-315.
#
# **It has now run: 33443800178, dispatched 2026-08-31, green in 38m.** Fifteen
# steps executed and `Publish` skipped, which is the arrangement above doing what
# it says. The run before it -- 33442511853 -- died at step four with two suites
# segfaulting inside GStreamer, and the install list below is what that fixed.
# Starting the four artefacts it left behind found a second thing, one layer down
# and not a fault in this file: no bundle carries a Qt media backend, so the
# AppImage can decode nothing on any machine. That is MOLE-317, and the step that
# checks plugins here cannot see it because it compares Mole's plugins and Qt's
# are a different tree.
#
# **And MOLE-322 then changed what the answer to that is allowed to be.** The Qt
# ffmpeg plugin is bundled and the codec libraries are not -- they are GPL-2+ or
# non-free and this artefact is Apache-2.0 -- so an AppImage on a host without
# ffmpeg reports no backend, correctly. The AppImage step below asked for codecs
# anyway and refused a release six steps before Publish -- run 33608556641. See
# MOLE-330.
name: Release

on:
  push:
    tags:
      - 'v*'
  # On demand, so the file can be exercised without spending a version number.
  # It publishes nothing -- see the note above and the guard on `Publish`.
  workflow_dispatch:

# Only what creating the release needs.
permissions:
  contents: write

# Every `run:` is bash with pipefail, stated once here rather than trusted.
#
# The default shell for a Linux runner is `bash -e {0}` -- `-e` without
# `-o pipefail`, so a pipeline takes the status of its last command and a step
# written as `something | tee log` cannot fail however `something` ended. This
# file used to carry a comment saying "there is no continue-on-error anywhere",
# which was true of the keyword and not of the pipelines. `shell: bash` gets
# `bash --noprofile --norc -eo pipefail {0}`. See MOLE-387.
defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Test, bundle and publish
    # The runner's distribution sets the glibc floor for everything built on it,
    # which is the AppImage's whole problem and has its own ticket (MOLE-122).
    # 24.04 is also the distribution the baseline Qt comes from: 6.4.2, the
    # version CMakeLists.txt requires and the one the author develops against.
    runs-on: ubuntu-24.04
    # A bound on a hang, not a measure of the work: a docker run that never
    # answers, an Xvfb that never starts or a dnf mirror that stalls otherwise
    # holds a runner for the six-hour maximum. See MOLE-390.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Qt 6.4 is the only hard dependency. Everything else is found QUIET and
      # switched on with a MOLE_HAVE_* flag, and src/core/CMakeLists.txt says
      # outright that a missing optional library must never stop the build -- so
      # which of them a release is built with is a decision rather than an
      # accident. An artefact built without LibArchive silently has no archive
      # browsing in it, and nobody would find out from the release page.
      #
      # This is the decision, in one place, and the step below refuses to publish
      # anything that came out missing one of them:
      #
      #   qt6-base, -declarative, -svg, -tools, the qml6 modules  the application
      #   libqt6sql6-sqlite       every table, index and scratch database
      #   qt6-pdf-dev             PDFs render as pages instead of a fact sheet
      #   qt6-multimedia-dev      video plays, with the QML module for the surface
      #   qml6-module-qtmultimedia
      #   gstreamer1.0-plugins-good  the decoders Qt Multimedia is a front end to
      #   gstreamer1.0-libav
      #   libarchive-dev          archives are browsable drives
      #   libcurl4-openssl-dev    sftp, ftp, s3 and webdav drives
      #   libssl-dev              the encrypted credential store, and s3 signing
      #   libsmbclient-dev        Windows shares
      #   libnfs-dev              NFS exports
      #   libvterm-dev            the terminal panel, rather than its own parser
      #   libgit2-dev             git state in the listing
      #   libxxhash-dev           the fast head filter for duplicate scans
      #   libarrow-dev            Parquet files as a grid -- see the step after
      #   libparquet-dev
      #
      # rpm and cpio are not for building anything: they are what unpacks the .rpm
      # so the licence check can be asked of it here rather than named as unasked.
      # xvfb and x11-utils are what starts an artefact against a real platform
      # plugin, and libxcb-cursor0 is what the plugin has needed since Qt 6.5 --
      # make-bundle.sh can only bundle what this machine has, so the tarball is
      # short of it unless the runner has it. See MOLE-300.
      #
      # **The GStreamer plugins are named because this file asks for none of what it
      # is not told to ask for**, and Qt Multimedia is a front end rather than a
      # decoder: `--no-install-recommends` is right for everything else here and it
      # is what left the first dispatch run with `gstreamer1.0-plugins-base` alone,
      # pulled in as a hard dependency. That is a machine that reports itself able to
      # decode video and cannot, and Mole believed it -- two suites went down with
      # `gst_element_link_many: assertion 'GST_IS_ELEMENT (element_2)' failed` and a
      # SIGSEGV inside the backend. See MOLE-314 for the run, and MOLE-316 for the
      # half of that which is Mole's rather than this file's: an artefact whose video
      # preview takes the application down on a machine as lean as this runner was.
      #
      # Two cases stay skipped here and that is not this: they want ffmpeg to *write*
      # a fixture, which is a question about test coverage on the release builder
      # rather than about what the artefact can do.
      #
      # ninja-build because that is the generator every preset uses.
      - name: Install what the artefact is built from
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools qt6-svg-dev libqt6sql6-sqlite \
            qt6-pdf-dev qt6-multimedia-dev qml6-module-qtmultimedia \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtquick-shapes \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libarchive-dev libcurl4-openssl-dev libssl-dev \
            libsmbclient-dev libnfs-dev libvterm-dev libgit2-dev libxxhash-dev \
            rpm cpio xvfb x11-utils libxcb-cursor0

      # Arrow is not in Ubuntu's archive at any version, so the Parquet grid can
      # only come from Apache's own repository -- which is where the author's
      # machine gets it too, so the artefact and the development build hold the
      # same reader. The alternative was an artefact whose Parquet preview is
      # silently absent, which is the accident this file exists to avoid.
      #
      # Through a script rather than four lines here, and the script checks the
      # signature on what it is about to give root to: this was a `wget` and an
      # `apt-get install` of a package fetched over a URL, in two workflows with a
      # copy each. See scripts/arrow-apt-source.sh and MOLE-390.
      - name: Arrow and Parquet, from Apache's own repository
        run: |
          sudo apt-get install -y --no-install-recommends ca-certificates lsb-release gnupg
          scripts/arrow-apt-source.sh

      # The fast tier, which is the whole suite anybody can run: 118 suites,
      # offscreen, no server. The live and heavy tiers are not here and cannot be
      # -- they need the test environment, the local gate has already run them,
      # and that division is the subject of MOLE-119.
      #
      # Before the build below rather than beside it: nothing is packed until this
      # has passed, and a step that fails stops the job, so a red suite attaches
      # nothing. There is no continue-on-error anywhere in this file.
      - name: The fast tier
        run: make test

      # What the artefact can actually do, checked rather than hoped. Every
      # optional library above earns a line in the configure summary when it is
      # found; Qt Pdf and Qt Multimedia are the two that say nothing when they are
      # there and complain when they are not. A missing one is a feature quietly
      # absent from a published build, so it fails here instead.
      #
      # The strings are the ones src/core/CMakeLists.txt and
      # src/plugins/CMakeLists.txt print, through
      # mole_optional_dependency(). tests/scripts/tst_ReleaseWorkflow.sh holds
      # them to that, so a reworded message breaks the suite here rather than a
      # release later.
      - name: Refuse a build with a feature missing
        run: |
          cmake --preset release 2>&1 | tee configure.log
          echo "--- what this runner gave the build ---"
          scripts/configure-summary.sh configure.log
          # The list lives in scripts/feature-summary.sh, which the AppImage
          # packer and tst_ReleaseWorkflow.sh read as well. Three copies had
          # already drifted -- the AppImage's was missing xxhash and the
          # Multimedia QML module -- and only one of the three was ever checked
          # against the CMake messages. See MOLE-387.
          . scripts/feature-summary.sh
          missing=0
          mole_check_summary full configure.log || missing=1
          [ "$missing" = 0 ] || { echo "::error::this build is missing something a release is supposed to have"; exit 1; }

      # make bundle installs, strips, brings the Qt libraries in through
      # scripts/make-bundle.sh, copies the licences, and runs
      # scripts/licence-check.sh -- which stays a hard failure. The LGPL
      # conditions are not optional and a release is exactly when they matter.
      - name: Bundle it
        run: make bundle

      # Every plugin that was built has to be in it. The network plugin was built
      # and never installed, so `make bundle` produced an artefact with no sftp,
      # ftp, s3 or webdav drives while the machine that built it had all four --
      # and the configure summary said "Network drives: sftp, ftp, s3, webdav",
      # because it was answering a different question. Derived from what is on disk
      # rather than from a list, so the next plugin is covered by existing.
      #
      # **`build/bundle`, which is where `make bundle` builds.** This read
      # `build/release/plugins` for its first two days: the step above configures
      # that directory to read the feature summary out of it and never builds it,
      # so `built` was empty, `shipped` had every plugin, and the step failed
      # whatever the artefact contained. It went in two days after the previous
      # release was cut, so the tag that followed was the first time it ran at
      # all. Two copies of a path, one of which moved.
      # tests/scripts/tst_ReleaseWorkflow.sh now reads the directory out of the
      # Makefile and holds this line against it. See MOLE-435.
      - name: Every plugin that was built is in the artefact
        run: |
          built=$(find build/bundle/plugins -name '*.so' -printf '%f\n' | sort)
          # Found rather than spelled out: GNUInstallDirs gives lib64 on every
          # RPM distribution, and a path with `lib` in it is a path that is right
          # on one family only. See MOLE-387.
          shipped=$(find dist/usr -type d -path '*/mole/plugins' -exec find {} -name '*.so' -printf '%f\n' \; | sort)
          # An empty list matches an empty list, so a build whose plugins all
          # failed would go out green off the comparison below. A release without
          # them is not a release: no sftp, no ftp, no s3, no webdav, no archives.
          if [ -z "$built" ]; then
            echo "::error::nothing was built at build/bundle/plugins -- this check is looking in the wrong place, or the plugins did not build"
            exit 1
          fi
          if [ "$built" != "$shipped" ]; then
            echo "built:   $built"
            echo "shipped: $shipped"
            echo "::error::a plugin was built and not packed -- a feature the artefact has not got"
            exit 1
          fi
          echo "$shipped"

      # The distribution packages, each built for the family it installs on. Both
      # come out of the install rules through CPack, so a package and
      # `make install` cannot come apart -- and both carry what their own
      # distribution can satisfy, which is not the same list: no Ubuntu archive has
      # Arrow, and Fedora packages it, so the .deb has no Parquet grid and the .rpm
      # does. The tarball above has it either way, because it carries its own
      # libraries.
      #
      # `make rpm` builds in a container of that family. An .rpm built on Debian
      # cannot be installed on an RPM system -- Debian's libcurl carries symbol
      # versions no RPM distribution provides, and rpmbuild records them as
      # requirements -- so the only honest way to produce one is to build it where
      # it will be installed. See scripts/package-rpm.sh.
      - name: The .deb, the .rpm and the AppImage
        run: make packages

      # And they install, on a clean system of each family, with nothing installed
      # by hand. This is the check the ticket asks for and it is the one a runner
      # can actually make: docker is on the runner, and a fresh container is a clean
      # system by definition.
      - name: Both packages install on a clean system
        run: |
          version=$(make version)
          # The codec line beside the two plugin lines, one step further down and for
          # the same reason: a package can install, start, load every Mole plugin and
          # still decode nothing, because Qt Multimedia is a front end that picks its
          # backend at run time. `none` there is not a missing feature but the state
          # that segfaulted this runner in MOLE-314, so it fails here. An uppercase
          # letter after the colon is a codec named; the failing answer begins
          # "none". See MOLE-317.
          #
          # --plugins rather than --version, and this is the check that matters: a
          # package can install, start and answer its version while loading none of
          # the plugins it shipped. Both of these did. GNUInstallDirs gives lib64 on
          # an RPM distribution, so the plugins went to /usr/lib64/mole/plugins and
          # nothing looked there -- no archive browsing and no network drives,
          # reported as nothing at all rather than as a failure. See MOLE-296.
          echo "--- Ubuntu ---"
          docker run --rm -v "$PWD/build/packages:/pkg:ro" ubuntu:24.04 bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq /pkg/mole_${version}_amd64.deb >/dev/null
            QT_QPA_PLATFORM=offscreen mole --plugins | tee /tmp/said
            grep -q 'Archive drives' /tmp/said
            grep -q 'Standard network drives' /tmp/said
            grep -qE 'video codecs it reports: [A-Z]' /tmp/said
            test -f /usr/share/applications/mole.desktop
            apt-get remove -y -qq mole >/dev/null
            test ! -e /usr/bin/mole"
          # **Fedora, and deliberately not the image that built the package.** The
          # check used to run in `fedora:40`, which is what `make rpm` built in --
          # so it asked whether a package installs on the machine that made it, and
          # that question has one answer. An .rpm records the sonames its binaries
          # link and the build container decides them, so what has to be shown is
          # that a *different* system can satisfy them.
          #
          # fedora-minimal is the same release stream and a much smaller package
          # set: the base image carries a few hundred packages that could satisfy a
          # requirement by accident, and the minimal one does not. If the two tags
          # ever disagree about the release this fails, and that is the honest
          # answer for a package whose requirements name minor versions rather than
          # a flake to pin around. See MOLE-389.
          echo "--- Fedora ---"
          docker run --rm -v "$PWD/build/packages:/pkg:ro" \
            registry.fedoraproject.org/fedora-minimal:latest bash -c "
            set -e
            dnf install -y -q /pkg/mole-${version}-1.x86_64.rpm >/dev/null
            QT_QPA_PLATFORM=offscreen mole --plugins | tee /tmp/said
            grep -q 'Archive drives' /tmp/said
            grep -q 'Standard network drives' /tmp/said
            grep -qE 'video codecs it reports: [A-Z]' /tmp/said
            test -f /usr/share/applications/mole.desktop
            dnf remove -y -q mole >/dev/null
            test ! -e /usr/bin/mole"

      # The AppImage's promise, checked on both ends of it. What it was built on
      # decides what it runs on -- it links glibc dynamically and cannot carry it --
      # so the floor is a promise to whoever downloads it, and a promise nothing
      # checks is a promise that quietly moves the day somebody bumps a base image.
      # Ubuntu 22.04 is the oldest distribution the floor reaches; 24.04 is the
      # newest thing here. Extracted rather than mounted, because a container has no
      # FUSE, and with the GL runtime any desktop has -- the bundle deliberately
      # leaves those to the host, since they belong to the graphics driver.
      #
      # The X client libraries are installed for that same reason and were missing
      # here: `is_excluded` in make-bundle.sh names them as the host's half of a
      # protocol whose other half is a running server, so every desktop has them and
      # a bare container has not. Nothing in the bundle needed them until it started
      # carrying a media backend, whose dependency closure reaches them through
      # libva. A container leaner than any desktop is not the machine this step is
      # asking about. See MOLE-317.
      - name: The AppImage starts on the oldest distribution it promises, and the newest
        run: |
          version=$(make version)
          for image in ubuntu:22.04 ubuntu:24.04; do
            echo "--- $image ---"
            docker run --rm -v "$PWD/build/packages:/pkg:ro" \
              -e APPIMAGE_EXTRACT_AND_RUN=1 -e DEBIAN_FRONTEND=noninteractive "$image" bash -c "
                set -e
                apt-get update -qq >/dev/null
                apt-get install -y -qq libglx0 libopengl0 libgl1 libegl1 \
                  libxrender1 libxcb-render0 libxfixes3 libxcb-cursor0 >/dev/null
                cp /pkg/mole-${version}-x86_64.AppImage /tmp/m && chmod +x /tmp/m
                cd /tmp && QT_QPA_PLATFORM=offscreen HOME=/tmp ./m --plugins" \
              | tee /tmp/said
            grep -qF "Mole ${version}" /tmp/said
            # The plugins it carries, for the reason the packages check them too.
            grep -q 'Archive drives' /tmp/said
            grep -q 'Standard network drives' /tmp/said
            # **What the media section may say here changed with MOLE-322, and this
            # check did not.** It asked for `video codecs it reports:` -- which is
            # what an artefact carrying a distribution's ffmpeg answers, and the
            # AppImage deliberately carries none since MOLE-322: libx264, libx265,
            # libxvidcore and libfdk-aac are GPL-2+ or non-free and an Apache-2.0
            # artefact cannot absorb them, so the codec stack is the host's. These
            # containers have no ffmpeg, so the honest answer is *none that will
            # load* -- and a release refused itself on this line six steps before
            # Publish, for asking the artefact to be what it had stopped being.
            # Run 33608556641.
            #
            # So what is asked now is the half that is the artefact's own: the
            # module is compiled in, and the plugin it looks for is the ffmpeg one.
            # Those are what MOLE-317 was about -- a bundle carrying no Qt media
            # backend at all, which no other check here can see, because this
            # compares Mole's plugins and Qt's are a different tree.
            grep -q 'multimedia module: built in' /tmp/said
            grep -q 'media backend asked for: ffmpeg' /tmp/said
            # And it says which of the outcomes it found rather than nothing at all.
            # On a container with no codec libraries that is the middle one, and
            # saying so is MOLE-316's whole subject: a missing decoder is an
            # ordinary answer that names what to install, not a silence.
            grep -qE 'backend found: (yes|none that will load)' /tmp/said
          done

      # And they start. Every other artefact check asks something a broken platform
      # plugin cannot fail -- `--version` and `--plugins` answer without initialising
      # one, and the containers have no X server to initialise against -- so the
      # AppImage went out unable to open a window at all and nothing noticed. This
      # starts both no-Qt-needed artefacts on a display of their own and waits for a
      # window. See MOLE-300.
      - name: The artefacts start and reach a window
        run: make start-check

      # The Qt LGPL conditions, asked of every artefact this release publishes: the
      # bundle, the .deb, the .rpm and the AppImage, each unpacked and asked about
      # its own paperwork. These are the conditions that let an Apache-2.0
      # application ship LGPL Qt at all, so a release is exactly when they count --
      # and until MOLE-298 the check was asking the working directory, which meant
      # it could not fail for the reason it exists.
      - name: The licence conditions, on every artefact
        run: make licence-check

      # Named after the version, which CMakeLists.txt is the only place holding --
      # see MOLE-117. Checked against the tag rather than trusted: they are written
      # by the same commit, so a tag on the wrong one is worth catching here.
      #
      # **On a dispatch there is no tag to compare against.** GITHUB_REF_NAME is the
      # branch then, so the comparison would fail every rehearsal for a reason that is
      # not a fault, and the version comes from CMakeLists.txt alone -- which is where
      # it always came from; the tag is the copy being checked. The check is not
      # skipped quietly but kept on the only path where a tag exists, which is the
      # only path that publishes, and the run says which of the two it did.
      - name: Pack the tarball
        run: |
          version=$(make version)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$version" = "$tag" ] || {
              echo "::error::the tag says $tag and the build says $version"
              exit 1
            }
            echo "the tag and the build agree on $version"
          else
            echo "$GITHUB_EVENT_NAME run: there is no tag, so the version is CMakeLists.txt's alone -- $version"
          fi
          name="mole-$version-x86_64"
          mv dist "$name"
          tar czf "$name.tar.gz" "$name"
          echo "TARBALL=$name.tar.gz" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The notes, which are not written here. They are this version's block in
      # CHANGELOG.md, taken out by the expression that file's own header states --
      # written by whoever landed the work rather than remembered at release time.
      # Anything typed here instead would be a second list of the same facts and
      # would disagree with the first inside two releases. An empty block stops the
      # release: it means either the marker is in the wrong place or nobody wrote a
      # line for anything that went in. See MOLE-123 and ADR-0080.
      #
      # Plus one generated line pointing at README.md's table at this tag, because a
      # release page shows four filenames and nothing that tells anybody which to
      # take. Generated and not written: a line assembled from the tag has nothing
      # to drift from, while a sentence about what the .deb lacks would be wrong the
      # first time an artefact changed. Nothing else goes in the body -- everything
      # anybody has wanted there is a fact that lives somewhere already, sizes
      # included, which GitHub prints beside every file it lists. See MOLE-303.
      # **A rehearsal excuses exactly one refusal here, and no others.** Nothing has
      # ever been released, so CHANGELOG.md holds no marker for any version and this
      # step cannot come back green on a dispatch until `make release` writes the
      # first one -- MOLE-315. That one message is reported and the run carries on;
      # anything else the script says stops it, so this does not become a check that
      # passes by doing nothing. On a push it is fatal exactly as it always was.
      - name: The release notes, out of the changelog
        run: |
          if scripts/release-notes.sh "$VERSION" "$GITHUB_REF_NAME" CHANGELOG.md > notes.md 2> refused; then
            echo "--- what will be published as the notes ---"
            cat notes.md
            exit 0
          fi
          cat refused
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::there are no notes to publish"
            exit 1
          fi
          grep -q "no release marker for $VERSION" refused || {
            echo "::error::the notes failed for something other than the one reason a rehearsal excuses"
            exit 1
          }
          echo "::notice::no changelog marker for $VERSION yet, so there are no notes to rehearse -- see MOLE-315"

      # What a rehearsal leaves behind. On a tag run these are attached to the release
      # itself and a second copy on the run would be storage for nothing; on a dispatch
      # there is no release, and a rehearsal nobody can download only tells you it
      # passed. The four are named one by one rather than as a directory, so the four
      # things a release publishes are the four things here.
      #
      # No `always()`, deliberately: a step that runs after a failure is the one thing
      # this file has never allowed, and a red rehearsal is answered by its own log.
      - name: Upload the four artefacts, so a rehearsal can be looked at
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mole-${{ env.VERSION }}-rehearsal
          if-no-files-found: error
          path: |
            ${{ env.TARBALL }}
            build/packages/mole_*.deb
            build/packages/mole-*.rpm
            build/packages/mole-*.AppImage

      # The release, with the artefacts on it. `gh` is on the runner and
      # authenticates with the job's own token, so there is no third-party action
      # in the path between a tag and a published artefact.
      #
      # **Guarded to a pushed tag, and that guard is what makes a rehearsal safe**: a
      # dispatch creates no release and pushes no tag, while every step above it runs
      # unchanged, which is the entire point of the exercise. The condition asks about
      # the event and not about job status, so it does not weaken the rule that a red
      # suite attaches nothing -- GitHub evaluates a step's `if` only while the job is
      # still succeeding, unless the expression asks about status itself.
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Mole $VERSION" \
            --notes-file notes.md \
            "$TARBALL" \
            build/packages/mole_*.deb \
            build/packages/mole-*.rpm \
            build/packages/mole-*.AppImage
